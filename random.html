<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生随机点名（25级3班、4班）</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 24px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            text-align: center;
            font-size: 200px;
            margin-top: 20px;
            color: #333;
        }
        table {
            width: 80%;
            max-width: 800px;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #007BFF;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>学生随机点名（25级3班、4班）</h1>
        <!-- 班级选择器：替换为25级3班、4班及合并选项 -->
        <select id="classSelector">
            <option value="25级3班">25级3班</option>
            <option value="25级4班">25级4班</option>
            <option value="25级3班4班合并">25级3班4班合并</option>
        </select>
        <button id="startStopButton" onclick="toggleRolling()">开始</button>
        <div id="result"></div>
    </div>
    <table>
        <thead>
            <tr>
                <th>班级</th>
                <th>学生序号</th>
                <th>姓名</th>
            </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
    </table>
    <script>
        // 学生列表：替换为25级3班、4班数据（已核对文档1、2，确保准确）
        const students = {
            "25级3班": [
                "谢文硕", "郭特", "郝良川", "张宇晴", "张琳森", "徐谦", "程源晓", "刘远鑫", "邵丽园", "徐文秀",
                "薛宪东", "解瑞姿", "孙嘉怡", "贾宇婷", "张冠群", "孔晓菡", "路作运", "李淑菲", "李志鹏", "李嘉庆",
                "李淑荣", "孔佩媛", "冯露", "冯钰淑", "张逸非", "于思诺", "谢智康", "王怀峻", "张家滔", "王山昭",
                "彭泽玉", "孔德赟", "于佳奇", "王谦", "任珂萱", "邵鑫梦", "刘正阳", "申玉尚", "侯文筱", "杨国发"
            ],
            "25级4班": [
                "张瑞彬", "袁思萌", "田佳雯", "郭童", "邓雨晨", "谭理想", "杨述余", "郑言泽", "宋玉存", "赵子诺",
                "侯思冉", "张艺潇", "李静瑶", "回姿旭", "庞泽", "王相哲", "杨志豪", "许雯萱", "刘毅航", "李犇",
                "谢文姿", "薛广超", "冯紫霜", "王佳豪", "刘贝贝", "刘博韩", "杜婉盈", "曹紫旋", "王帆", "孙振京",
                "梁邦泉", "王文佳", "王雨晨", "周敏晨", "田蒙恩", "王梦菲", "王嘉琪", "张文昊", "陶峻熙", "李鹏飞",
                "靳纪顺", "张坦"
            ],
            "25级3班4班合并": [
                // 合并25级3班所有学生
                "谢文硕", "郭特", "郝良川", "张宇晴", "张琳森", "徐谦", "程源晓", "刘远鑫", "邵丽园", "徐文秀",
                "薛宪东", "解瑞姿", "孙嘉怡", "贾宇婷", "张冠群", "孔晓菡", "路作运", "李淑菲", "李志鹏", "李嘉庆",
                "李淑荣", "孔佩媛", "冯露", "冯钰淑", "张逸非", "于思诺", "谢智康", "王怀峻", "张家滔", "王山昭",
                "彭泽玉", "孔德赟", "于佳奇", "王谦", "任珂萱", "邵鑫梦", "刘正阳", "申玉尚", "侯文筱", "杨国发",
                // 合并25级4班所有学生
                "张瑞彬", "袁思萌", "田佳雯", "郭童", "邓雨晨", "谭理想", "杨述余", "郑言泽", "宋玉存", "赵子诺",
                "侯思冉", "张艺潇", "李静瑶", "回姿旭", "庞泽", "王相哲", "杨志豪", "许雯萱", "刘毅航", "李犇",
                "谢文姿", "薛广超", "冯紫霜", "王佳豪", "刘贝贝", "刘博韩", "杜婉盈", "曹紫旋", "王帆", "孙振京",
                "梁邦泉", "王文佳", "王雨晨", "周敏晨", "田蒙恩", "王梦菲", "王嘉琪", "张文昊", "陶峻熙", "李鹏飞",
                "靳纪顺", "张坦"
            ]
        };

        // 显示学生列表（逻辑不变，自动遍历25级数据）
        const tableBody = document.getElementById('studentTableBody');
        for (const [className, studentList] of Object.entries(students)) {
            studentList.forEach((student, index) => {
                const row = document.createElement('tr');
                const classCell = document.createElement('td');
                const indexCell = document.createElement('td');
                const nameCell = document.createElement('td');
                // 仅在每个班级第一行显示班级名称（避免重复）
                classCell.textContent = index === 0 ? className : '';
                indexCell.textContent = index + 1; // 序号从1开始
                nameCell.textContent = student;
                row.appendChild(classCell);
                row.appendChild(indexCell);
                row.appendChild(nameCell);
                tableBody.appendChild(row);
            });
        }

        // 随机点名逻辑（完全保留原功能：点击开始/停止、3秒自动停止）
        let rolling = false;
        let intervalId;
        let timeoutId;
        function toggleRolling() {
            const button = document.getElementById('startStopButton');
            const resultDiv = document.getElementById('result');
            const selectedClass = document.getElementById('classSelector').value;
            const studentList = students[selectedClass];

            if (!rolling) {
                // 开始滚动：100ms切换一次名字
                rolling = true;
                button.textContent = "停止";
                intervalId = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * studentList.length);
                    resultDiv.textContent = studentList[randomIndex];
                }, 100);

                // 3秒后自动停止（避免忘记点击）
                timeoutId = setTimeout(() => {
                    rolling = false;
                    button.textContent = "开始";
                    clearInterval(intervalId);
                }, 3000);
            } else {
                // 手动停止：清除定时器
                rolling = false;
                button.textContent = "开始";
                clearInterval(intervalId);
                clearTimeout(timeoutId);
            }
        }
    </script>
</body>
</html>
